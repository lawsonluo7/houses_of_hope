<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Houses of Hope</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <style>
      :root {
        --bg: #2a3f21;
        --panel: #9cc5a1;
        --panel-border: rgba(33, 48, 59, 0.12);
        --primary: #2d6a4f;
        --primary-dark: #1f4d3a;
        --text: #1d2a2f;
        --shadow: rgba(24, 41, 46, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        background-image: url("bg.jpg");
        background-repeat: no-repeat;
        background-size: cover;
        background-position: center;
        color: var(--text);
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }

      .page-shell {
        width: 60%;
        min-height: 60%;
        margin: 0 auto;
        padding: 30px 24px 28px;
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 24px;
        box-shadow: 0 16px 40px var(--shadow);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }

      h1 {
        margin: 0 0 18px;
        font-size: clamp(2rem, 4vw, 4rem);
        line-height: 1.1;
      }

      .logo-wrap {
        margin-bottom: 26px;
      }

      .logo {
        display: block;
        width: min(240px, 60vw);
        height: auto;
        max-height: 180px;
        object-fit: contain;
      }

      .button-row {
        width: min(100%, 700px);
        display: flex;
        flex-direction: row;
        gap: 24px;
        justify-content: center;
      }

      .action-btn {
        flex: 1 1 0;
        min-height: 82px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px 24px;
        border-radius: 18px;
        background: var(--primary);
        color: #fff;
        text-decoration: none;
        font-weight: 700;
        font-size: clamp(1rem, 1.8vw, 1.6rem);
        box-shadow: 0 10px 18px rgba(45, 106, 79, 0.2);
        transition: transform 0.2s ease, background 0.2s ease;
      }

      .action-btn:hover {
        background: var(--primary-dark);
        transform: translateY(-2px);
      }

      .logout-link {
        display: none;
        margin-top: 18px;
        font-size: 0.9rem;
        color: var(--primary-dark);
        text-decoration: underline;
        cursor: pointer;
      }

      .logout-link.visible {
        display: inline-block;
      }

      @media (orientation: portrait) {
        .button-row {
          flex-direction: column;
        }

        .action-btn {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="page-shell">
      <h1>Houses of Hope</h1>

      <div class="logo-wrap">
        <img src="logo.png" alt="Houses of Hope logo" class="logo" />
      </div>

      <div class="button-row" aria-label="Main actions">
        <a id="primaryAction" class="action-btn"></a>
        <a id="secondaryAction" class="action-btn"></a>
      </div>

      <a id="logoutLink" class="logout-link" href="#">Log out</a>
    </div>

    <script>
      function isSignedIn() {
        const token = localStorage.getItem("authToken");
        return token !== null && token !== undefined;
      }

      const primaryAction = document.getElementById("primaryAction");
      const secondaryAction = document.getElementById("secondaryAction");
      const logoutLink = document.getElementById("logoutLink");

      if (isSignedIn()) {
        primaryAction.textContent = "Find a Shelter";
        primaryAction.href = "find-a-shelter.html";
        secondaryAction.textContent = "List a Shelter";
        secondaryAction.href = "list-a-shelter.html";
        logoutLink.classList.add("visible");
      } else {
        primaryAction.textContent = "Create Account";
        primaryAction.href = "create-account.html";
        secondaryAction.textContent = "Login";
        secondaryAction.href = "login.html";
      }

      logoutLink.addEventListener("click", (event) => {
        event.preventDefault();
        localStorage.removeItem("authToken");
        localStorage.removeItem("loggedInUser");
        localStorage.removeItem("lastLoginEmail");
        window.location.href = "index.html";
      });
    </script>
  </body>
</html>
