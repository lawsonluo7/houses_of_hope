<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>List a Shelter | Houses of Hope</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <style>
      :root {
        --bg: #2a3f21;
        --panel: #9cc5a1;
        --panel-border: rgba(33, 48, 59, 0.12);
        --primary: #2d6a4f;
        --primary-dark: #1f4d3a;
        --text: #1d2a2f;
        --error: #9c2b2b;
        --success: #255d3c;
        --shadow: rgba(24, 41, 46, 0.16);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        background-image: url("bg.jpg");
        background-repeat: no-repeat;
        background-size: cover;
        background-position: center;
        color: var(--text);
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .page-shell {
        width: min(760px, 100%);
        background: rgba(156, 197, 161, 0.96);
        border: 1px solid var(--panel-border);
        border-radius: 24px;
        box-shadow: 0 20px 44px var(--shadow);
        padding: 28px 24px 24px;
      }

      h1 {
        margin: 0 0 10px;
        text-align: center;
        font-size: clamp(2rem, 4vw, 2.8rem);
      }

      .subtitle {
        margin: 0 0 24px;
        text-align: center;
        color: rgba(29, 42, 47, 0.8);
      }

      form {
        display: grid;
        gap: 18px;
      }

      .field, .row, .checkbox-group, .radio-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      label {
        font-weight: 700;
      }

      input, textarea, select {
        width: 100%;
        border: 1px solid rgba(29, 42, 47, 0.18);
        background: rgba(255, 255, 255, 0.7);
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 1rem;
        color: var(--text);
        outline: none;
      }

      input:focus, textarea:focus, select:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(45, 106, 79, 0.15);
      }

      textarea {
        min-height: 110px;
        resize: vertical;
      }

      .checkbox-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 10px 12px;
      }

      .checkbox-item, .radio-item {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
        color: rgba(29, 42, 47, 0.85);
      }

      .checkbox-item input, .radio-item input {
        width: 16px;
        height: 16px;
        accent-color: var(--primary);
      }

      .inline-row {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
      }

      button {
        border: none;
        border-radius: 12px;
        background: var(--primary);
        color: #fff;
        font-size: 1.05rem;
        font-weight: 700;
        padding: 15px 18px;
        cursor: pointer;
        transition: background 0.2s ease, transform 0.2s ease;
      }

      button:hover {
        background: var(--primary-dark);
        transform: translateY(-1px);
      }

      .message {
        min-height: 24px;
        font-weight: 700;
        color: var(--success);
      }

      .message.error {
        color: var(--error);
      }

      .secondary-link {
        display: block;
        text-align: center;
        margin-top: 12px;
        color: var(--primary-dark);
        text-decoration: none;
        font-weight: 700;
      }

      .secondary-link:hover {
        text-decoration: underline;
      }

      .address-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .address-grid .field {
        margin-bottom: 0;
      }

      .shelter-manager {
        margin-top: 22px;
        padding-top: 18px;
        border-top: 1px solid rgba(29, 42, 47, 0.14);
      }

      .shelter-manager h2 {
        margin: 0 0 14px;
        font-size: 1.4rem;
      }

      .shelter-list {
        display: grid;
        gap: 12px;
      }

      .shelter-item {
        background: rgba(255, 255, 255, 0.42);
        border: 1px solid rgba(29, 42, 47, 0.14);
        border-radius: 14px;
        padding: 14px 16px;
      }

      .shelter-item-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 10px;
      }

      .shelter-item-header strong {
        font-size: 1.05rem;
      }

      .shelter-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .action-button {
        padding: 8px 12px;
        font-size: 0.9rem;
      }

      .action-button.secondary {
        background: #d8ead9;
        color: var(--text);
      }

      .action-button.danger {
        background: #b85a5a;
      }

      .shelter-requests {
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid rgba(29, 42, 47, 0.14);
      }

      .shelter-requests h4 {
        margin: 0 0 8px;
        font-size: 0.95rem;
      }

      .request-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 8px;
      }

      .request-item {
        background: rgba(255, 255, 255, 0.34);
        border: 1px solid rgba(29, 42, 47, 0.12);
        border-radius: 10px;
        padding: 8px 10px;
      }

      .request-item strong {
        display: block;
        margin-bottom: 4px;
      }

      .empty-state {
        margin: 0;
        padding: 14px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.35);
        color: rgba(29, 42, 47, 0.8);
      }

      @media (max-width: 640px) {
        .address-grid {
          grid-template-columns: 1fr;
        }

        .shelter-item-header {
          flex-direction: column;
          align-items: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <main class="page-shell">
      <h1>List a Shelter</h1>
      <p class="subtitle">Add your housing information so families can find a safe place to stay.</p>

      <form id="listShelterForm" novalidate>
        <div class="field">
          <label>Address</label>
          <div class="address-grid">
            <div class="field">
              <label for="houseNumber">House number</label>
              <input id="houseNumber" name="houseNumber" type="text" placeholder="123" required />
            </div>
            <div class="field">
              <label for="street">Street</label>
              <input id="street" name="street" type="text" placeholder="Main Street" required />
            </div>
            <div class="field">
              <label for="city">City</label>
              <input id="city" name="city" type="text" placeholder="Springfield" required />
            </div>
            <div class="field">
              <label for="zipCode">Zip</label>
              <input id="zipCode" name="zipCode" type="text" placeholder="12345" required />
            </div>
            <div class="field" style="grid-column: 1 / -1;">
              <label for="country">Country</label>
              <input id="country" name="country" type="text" placeholder="United States" required />
            </div>
          </div>
        </div>

        <div class="field">
          <label for="capacity">How many people can you house?</label>
          <input id="capacity" name="capacity" type="number" min="1" step="1" placeholder="e.g. 4" required />
        </div>

        <div class="checkbox-group">
          <label>What pets do you have?</label>
          <div class="checkbox-grid">
            <label class="checkbox-item"><input type="checkbox" name="pets" value="dog" /> Dog</label>
            <label class="checkbox-item"><input type="checkbox" name="pets" value="cat" /> Cat</label>
            <label class="checkbox-item"><input type="checkbox" name="pets" value="bird" /> Bird</label>
            <label class="checkbox-item"><input type="checkbox" name="pets" value="fish" /> Fish</label>
            <label class="checkbox-item"><input type="checkbox" name="pets" value="rabbit" /> Rabbit</label>
            <label class="checkbox-item"><input type="checkbox" name="pets" value="other" id="petOtherToggle" /> Other</label>
          </div>
          <input id="petOtherText" type="text" placeholder="List other pets" />
        </div>

        <div class="radio-group">
          <label>Are you willing to receive animals?</label>
          <div class="inline-row">
            <label class="radio-item"><input type="radio" name="receiveAnimals" value="yes" checked /> Yes</label>
            <label class="radio-item"><input type="radio" name="receiveAnimals" value="no" /> No</label>
          </div>
        </div>

        <div class="field">
          <label for="otherDetails">Other housing conditions</label>
          <textarea id="otherDetails" name="otherDetails" placeholder="Example: clean up after yourself, quiet hours, must bring bedding, no smoking inside."></textarea>
        </div>

        <button type="submit">Save shelter listing</button>
        <div id="message" class="message" role="alert" aria-live="polite"></div>
      </form>

      <section class="shelter-manager" aria-live="polite">
        <h2>Current shelters</h2>
        <div id="shelterList" class="shelter-list"></div>
      </section>

      <a class="secondary-link" href="index.html">Back home</a>
    </main>

    <script src="User.js"></script>
    <script>
      const listShelterForm = document.getElementById("listShelterForm");
      const shelterListEl = document.getElementById("shelterList");
      const messageEl = document.getElementById("message");
      const petOtherToggle = document.getElementById("petOtherToggle");
      const petOtherText = document.getElementById("petOtherText");
      let editingShelterId = null;

      function getLoggedInUserEmail() {
        const authToken = localStorage.getItem("authToken");
        if (!authToken) {
          window.location.href = "login.html";
          return null;
        }

        const loggedInUser = JSON.parse(localStorage.getItem("loggedInUser") || "{}");
        return loggedInUser.email || authToken || null;
      }

      async function readAccounts() {
        try {
          const response = await fetch("accounts.json", { cache: "no-store" });
          if (!response.ok) throw new Error("Missing accounts file");
          const text = await response.text();
          return text.trim() ? JSON.parse(text) : [];
        } catch (error) {
          const fallback = JSON.parse(localStorage.getItem("accountsFallback") || "[]");
          return Array.isArray(fallback) ? fallback : [];
        }
      }

      async function saveAccounts(users) {
        const payload = JSON.stringify(users, null, 2);

        try {
          await fetch("accounts.json", {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: payload
          });
        } catch (error) {
          localStorage.setItem("accountsFallback", JSON.stringify(users));
        }
      }

      function parseAddressParts(address) {
        const parts = (address || "").split(",").map((part) => part.trim()).filter(Boolean);
        const houseNumber = parts[0] || "";
        const street = parts[1] || "";
        const city = parts[2] || "";
        const zipCode = parts[3] || "";
        const country = parts[4] || "";

        return { houseNumber, street, city, zipCode, country };
      }

      function populateFormFromShelter(shelter = {}) {
        const addressParts = parseAddressParts(shelter.address || "");

        document.getElementById("houseNumber").value = addressParts.houseNumber;
        document.getElementById("street").value = addressParts.street;
        document.getElementById("city").value = addressParts.city;
        document.getElementById("zipCode").value = addressParts.zipCode;
        document.getElementById("country").value = addressParts.country;
        document.getElementById("capacity").value = shelter.capacity ?? "";
        document.getElementById("otherDetails").value = shelter.otherDetails ?? "";

        document.querySelectorAll('input[name="pets"]').forEach((input) => {
          const shouldCheck = Array.isArray(shelter.pets) && shelter.pets.includes(input.value);
          input.checked = shouldCheck;
        });

        const hasOtherPet = Array.isArray(shelter.pets) && shelter.pets.some((pet) => !["dog", "cat", "bird", "fish", "rabbit"].includes(pet));
        petOtherToggle.checked = hasOtherPet;
        petOtherText.disabled = !hasOtherPet;
        petOtherText.value = hasOtherPet ? (shelter.pets.find((pet) => !["dog", "cat", "bird", "fish", "rabbit"].includes(pet)) || "") : "";

        const receiveAnimalsValue = shelter.openToReceivePets ? "yes" : "no";
        const receiveAnimalsRadio = document.querySelector(`input[name="receiveAnimals"][value="${receiveAnimalsValue}"]`);
        if (receiveAnimalsRadio) {
          receiveAnimalsRadio.checked = true;
        }
      }

      function renderShelterList(user) {
        const shelters = Array.isArray(user?.listedShelters) ? user.listedShelters : [];

        if (!shelters.length) {
          shelterListEl.innerHTML = '<p class="empty-state">No shelters listed yet. Add one above to get started.</p>';
          return;
        }

        shelterListEl.innerHTML = shelters.map((shelter, index) => {
          const shelterId = String(shelter?.id ?? `${shelter?.address ?? "shelter"}-${index}`);
          const petText = Array.isArray(shelter?.pets) && shelter.pets.length
            ? shelter.pets.join(", ")
            : "No pets listed";
          const requests = Array.isArray(shelter?.requests) ? shelter.requests : [];
          const requestMarkup = requests.length
            ? `
                <ul class="request-list">
                  ${requests.map((request) => {
                    const requestName = request?.name || request?.contactInfo?.name || "New request";
                    const requestEmail = request?.email || request?.contactInfo?.email || "No email provided";
                    const requestDetails = request?.notes || request?.preferences || "No additional notes";
                    const peopleCount = request?.peopleCount ?? 0;

                    return `
                      <li class="request-item">
                        <strong>${requestName.replace(/</g, "&lt;")} • ${peopleCount} people</strong>
                        <div>Email: ${requestEmail.replace(/</g, "&lt;")}</div>
                        <div>Phone: ${(request?.phone || request?.contactInfo?.phone || "Not provided").replace(/</g, "&lt;")}</div>
                        <div>${requestDetails.replace(/</g, "&lt;")}</div>
                      </li>
                    `;
                  }).join("")}
                </ul>
              `
            : '<p class="empty-state">No requests yet.</p>';

          return `
            <article class="shelter-item" data-shelter-id="${shelterId}">
              <div class="shelter-item-header">
                <strong>${(shelter?.address || "Untitled shelter").replace(/</g, "&lt;")}</strong>
                <div class="shelter-actions">
                  <button type="button" class="action-button secondary edit-shelter" data-shelter-id="${shelterId}">Edit</button>
                  <button type="button" class="action-button danger remove-shelter" data-shelter-id="${shelterId}">Remove</button>
                </div>
              </div>
              <div><strong>Capacity:</strong> ${shelter?.capacity ?? 0}</div>
              <div><strong>Pets:</strong> ${petText.replace(/</g, "&lt;")}</div>
              <div><strong>Open to receiving animals:</strong> ${shelter?.openToReceivePets ? "Yes" : "No"}</div>
              <div><strong>Notes:</strong> ${(shelter?.otherDetails || "No additional details").replace(/</g, "&lt;")}</div>

              <div class="shelter-requests">
                <h4>Incoming requests</h4>
                ${requestMarkup}
              </div>
            </article>
          `;
        }).join("");
      }

      async function reloadCurrentUserShelters() {
        const email = getLoggedInUserEmail();
        if (!email) {
          return;
        }

        const accounts = await readAccounts();
        const accountIndex = accounts.findIndex((record) => (record.email || "").toLowerCase() === email.toLowerCase());

        if (accountIndex === -1) {
          return;
        }

        const user = User.fromObject(accounts[accountIndex]);
        renderShelterList(user);
      }

      petOtherToggle.addEventListener("change", () => {
        petOtherText.disabled = !petOtherToggle.checked;
        if (!petOtherToggle.checked) {
          petOtherText.value = "";
        }
      });

      shelterListEl.addEventListener("click", async (event) => {
        const target = event.target.closest("button");
        if (!target) {
          return;
        }

        const email = getLoggedInUserEmail();
        if (!email) {
          setMessage("You must be logged in to manage shelters.", true);
          return;
        }

        const shelterId = target.dataset.shelterId;
        const accounts = await readAccounts();
        const accountIndex = accounts.findIndex((record) => (record.email || "").toLowerCase() === email.toLowerCase());

        if (accountIndex === -1) {
          setMessage("Your account could not be found. Please log in again.", true);
          return;
        }

        const user = User.fromObject(accounts[accountIndex]);
        const shelterIndex = user.listedShelters.findIndex((shelter) => String(shelter?.id ?? `${shelter?.address ?? "shelter"}-${accountIndex}`) === String(shelterId));

        if (target.classList.contains("remove-shelter")) {
          if (shelterIndex === -1) {
            return;
          }

          user.removeShelterListing(String(shelterId));
          accounts[accountIndex] = user;
          await saveAccounts(accounts);
          editingShelterId = null;
          listShelterForm.reset();
          petOtherText.disabled = true;
          setMessage("Shelter removed.");
          await reloadCurrentUserShelters();
          return;
        }

        if (target.classList.contains("edit-shelter")) {
          if (shelterIndex === -1) {
            return;
          }

          const shelter = user.listedShelters[shelterIndex];
          editingShelterId = String(shelter?.id ?? shelterId);
          populateFormFromShelter(shelter);
          setMessage(`Editing shelter at ${shelter.address}.`);
          listShelterForm.scrollIntoView({ behavior: "smooth", block: "start" });
        }
      });

      listShelterForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        const email = getLoggedInUserEmail();
        if (!email) {
          setMessage("You must be logged in to list a shelter.", true);
          return;
        }

        const houseNumber = document.getElementById("houseNumber").value.trim();
        const street = document.getElementById("street").value.trim();
        const city = document.getElementById("city").value.trim();
        const zipCode = document.getElementById("zipCode").value.trim();
        const country = document.getElementById("country").value.trim();
        const address = [houseNumber, street, city, zipCode, country].filter(Boolean).join(", ");
        const capacity = Number(document.getElementById("capacity").value);

        if (!houseNumber || !street || !city || !zipCode || !country || !capacity || capacity < 1) {
          setMessage("Please add a valid address and capacity.", true);
          return;
        }

        const accounts = await readAccounts();
        const accountIndex = accounts.findIndex((record) => (record.email || "").toLowerCase() === email.toLowerCase());

        if (accountIndex === -1) {
          setMessage("Your account could not be found. Please log in again.", true);
          return;
        }

        const user = User.fromObject(accounts[accountIndex]);
        const selectedPets = Array.from(document.querySelectorAll('input[name="pets"]:checked'))
          .map((input) => input.value === "other" ? petOtherText.value.trim() : input.value)
          .filter(Boolean);

        let shelter;
        if (editingShelterId) {
          const targetIndex = user.listedShelters.findIndex((entry) => String(entry?.id ?? entry?.address ?? '') === String(editingShelterId));
          const updatedShelter = new Shelter(
            address,
            capacity,
            selectedPets,
            document.querySelector('input[name="receiveAnimals"]:checked').value === "yes",
            document.getElementById("otherDetails").value.trim(),
            editingShelterId
          );

          if (targetIndex === -1) {
            user.listedShelters.push(updatedShelter);
          } else {
            user.listedShelters[targetIndex] = updatedShelter;
          }
          shelter = updatedShelter;
        } else {
          shelter = user.setShelterListing({
            address,
            capacity,
            pets: selectedPets,
            openToReceivePets: document.querySelector('input[name="receiveAnimals"]:checked').value === "yes",
            otherDetails: document.getElementById("otherDetails").value.trim()
          });
        }

        accounts[accountIndex] = user;
        await saveAccounts(accounts);

        const wasEditing = Boolean(editingShelterId);
        listShelterForm.reset();
        editingShelterId = null;
        petOtherText.disabled = true;
        setMessage(`Shelter ${wasEditing ? "updated" : "saved"} for ${shelter.address}.`);
        await reloadCurrentUserShelters();
      });

      petOtherText.disabled = true;
      reloadCurrentUserShelters();
    </script>
  </body>
</html>
