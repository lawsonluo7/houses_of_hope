<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account | Houses of Hope</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <style>
      :root {
        --bg: #2a3f21;
        --panel: #9cc5a1;
        --primary: #2d6a4f;
        --primary-dark: #1f4d3a;
        --text: #1d2a2f;
        --error: #9c2b2b;
        --success: #255d3c;
        --shadow: rgba(24, 41, 46, 0.16);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        background-image: url("bg.jpg");
        background-repeat: no-repeat;
        background-size: cover;
        background-position: center;
        color: var(--text);
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .card {
        width: min(560px, 100%);
        background: rgba(156, 197, 161, 0.96);
        border-radius: 24px;
        box-shadow: 0 20px 44px var(--shadow);
        padding: 30px 28px 24px;
      }

      .brand {
        text-align: center;
        margin-bottom: 24px;
      }

      .brand img {
        width: min(220px, 60vw);
        height: auto;
        margin-bottom: 12px;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 4vw, 2.8rem);
      }

      .subtitle {
        margin: 10px 0 0;
        color: rgba(29, 42, 47, 0.8);
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      label {
        font-weight: 700;
      }

      input {
        width: 100%;
        border: 1px solid rgba(29, 42, 47, 0.18);
        background: rgba(255, 255, 255, 0.7);
        border-radius: 12px;
        padding: 14px 16px;
        font-size: 1rem;
        outline: none;
      }

      input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(45, 106, 79, 0.15);
      }

      button {
        border: none;
        border-radius: 12px;
        background: var(--primary);
        color: #fff;
        font-size: 1.05rem;
        font-weight: 700;
        padding: 15px 18px;
        cursor: pointer;
        transition: background 0.2s ease, transform 0.2s ease;
      }

      button:hover {
        background: var(--primary-dark);
        transform: translateY(-1px);
      }

      .message {
        min-height: 24px;
        font-weight: 700;
        color: var(--success);
      }

      .message.error {
        color: var(--error);
      }

      .bottom-text {
        margin-top: 18px;
        text-align: center;
      }

      .bottom-text a {
        color: var(--primary-dark);
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="brand">
        <img src="logo.png" alt="Houses of Hope logo" />
        <h1>Create account</h1>
        <p class="subtitle">Join the community and help families find safe shelter.</p>
      </div>

      <form id="signupForm" novalidate>
        <div class="field">
          <label for="name">Full name</label>
          <input id="name" name="name" type="text" placeholder="Jane Doe" required />
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="you@example.com" required />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="Create a secure password" required />
        </div>

        <div class="field">
          <label for="confirmPassword">Confirm password</label>
          <input id="confirmPassword" name="confirmPassword" type="password" placeholder="Re-enter your password" required />
        </div>

        <button type="submit">Create account</button>
        <div id="message" class="message" role="alert" aria-live="polite"></div>
      </form>

      <p class="bottom-text">
        Already have an account? <a href="login.html">Log in</a>
      </p>
    </main>

    <script src="User.js"></script>
    <script>
      const signupForm = document.getElementById("signupForm");
      const messageEl = document.getElementById("message");

      function setMessage(text, isError = false) {
        messageEl.textContent = text;
        messageEl.classList.toggle("error", isError);
      }

      async function readAccounts() {
        try {
          const response = await fetch("accounts.json", { cache: "no-store" });
          if (!response.ok) throw new Error("Missing accounts file");
          const text = await response.text();
          return text.trim() ? JSON.parse(text) : [];
        } catch (error) {
          const fallback = JSON.parse(localStorage.getItem("accountsFallback") || "[]");
          return Array.isArray(fallback) ? fallback : [];
        }
      }

      async function saveAccounts(users) {
        const payload = JSON.stringify(users, null, 2);

        try {
          await fetch("accounts.json", {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: payload
          });
        } catch (error) {
          localStorage.setItem("accountsFallback", JSON.stringify(users));
        }
      }

      signupForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim().toLowerCase();
        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirmPassword").value;

        if (!name || !email || !password || !confirmPassword) {
          setMessage("Please complete all fields.", true);
          return;
        }

        if (password.length < 6) {
          setMessage("Password must be at least 6 characters long.", true);
          return;
        }

        if (password !== confirmPassword) {
          setMessage("Passwords do not match.", true);
          return;
        }

        const accounts = await readAccounts();
        const emailExists = accounts.some((user) => (user.email || "").toLowerCase() === email);

        if (emailExists) {
          setMessage("An account with that email already exists.", true);
          return;
        }

        const newUser = new User(name, email, password);
        accounts.push(newUser);
        await saveAccounts(accounts);

        localStorage.setItem("authToken", newUser.email);
        localStorage.setItem("loggedInUser", JSON.stringify({ name: newUser.name, email: newUser.email }));
        localStorage.setItem("lastLoginEmail", newUser.email);

        setMessage("Account created successfully.");
        window.location.href = "index.html";
      });
    </script>
  </body>
</html>
