<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Find a Shelter | Houses of Hope</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <style>
      :root {
        --bg: #2a3f21;
        --panel: #9cc5a1;
        --panel-border: rgba(33, 48, 59, 0.12);
        --primary: #2d6a4f;
        --primary-dark: #1f4d3a;
        --text: #1d2a2f;
        --error: #9c2b2b;
        --success: #255d3c;
        --shadow: rgba(24, 41, 46, 0.16);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        background-image: url("bg.jpg");
        background-repeat: no-repeat;
        background-size: cover;
        background-position: center;
        color: var(--text);
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .page-shell {
        width: min(760px, 100%);
        background: rgba(156, 197, 161, 0.96);
        border: 1px solid var(--panel-border);
        border-radius: 24px;
        box-shadow: 0 20px 44px var(--shadow);
        padding: 28px 24px 24px;
      }

      h1 {
        margin: 0 0 10px;
        text-align: center;
        font-size: clamp(2rem, 4vw, 2.8rem);
      }

      .subtitle {
        margin: 0 0 24px;
        text-align: center;
        color: rgba(29, 42, 47, 0.8);
      }

      form {
        display: grid;
        gap: 18px;
      }

      .field, .group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      label {
        font-weight: 700;
      }

      input, textarea, select {
        width: 100%;
        border: 1px solid rgba(29, 42, 47, 0.18);
        background: rgba(255, 255, 255, 0.7);
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 1rem;
        color: var(--text);
        outline: none;
      }

      input:focus, textarea:focus, select:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(45, 106, 79, 0.15);
      }

      textarea {
        min-height: 110px;
        resize: vertical;
      }

      .inline-row {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
      }

      .radio-item {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
        color: rgba(29, 42, 47, 0.85);
      }

      .radio-item input {
        width: 16px;
        height: 16px;
        accent-color: var(--primary);
      }

      button {
        border: none;
        border-radius: 12px;
        background: var(--primary);
        color: #fff;
        font-size: 1.05rem;
        font-weight: 700;
        padding: 15px 18px;
        cursor: pointer;
        transition: background 0.2s ease, transform 0.2s ease;
      }

      button:hover {
        background: var(--primary-dark);
        transform: translateY(-1px);
      }

      .message {
        min-height: 24px;
        font-weight: 700;
        color: var(--success);
      }

      .message.error {
        color: var(--error);
      }

      .secondary-link {
        display: block;
        text-align: center;
        margin-top: 12px;
        color: var(--primary-dark);
        text-decoration: none;
        font-weight: 700;
      }

      .secondary-link:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <main class="page-shell">
      <h1>Find a Shelter</h1>
      <p class="subtitle">Tell us about your household and shelter needs so we can match you with the right option.</p>

      <form id="findShelterForm" novalidate>
        <div class="field">
          <label for="name">Full name</label>
          <input id="name" name="name" type="text" placeholder="Jane Doe" required />
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="you@example.com" required />
        </div>

        <div class="field">
          <label for="phone">Phone number</label>
          <input id="phone" name="phone" type="tel" placeholder="(555) 123-4567" />
        </div>

        <div class="field">
          <label for="peopleCount">How many people need to be housed?</label>
          <input id="peopleCount" name="peopleCount" type="number" min="1" step="1" placeholder="e.g. 3" required />
        </div>

        <div class="group">
          <label>Do you own pets?</label>
          <div class="inline-row">
            <label class="radio-item"><input type="radio" name="hasPets" value="yes" /> Yes</label>
            <label class="radio-item"><input type="radio" name="hasPets" value="no" checked /> No</label>
          </div>
        </div>

        <div class="group">
          <label>Would you mind an animal in the shelter?</label>
          <div class="inline-row">
            <label class="radio-item"><input type="radio" name="animalInShelter" value="yes" /> Yes</label>
            <label class="radio-item"><input type="radio" name="animalInShelter" value="no" checked /> No</label>
          </div>
        </div>

        <div class="field">
          <label for="allergies">Allergies or health concerns</label>
          <textarea id="allergies" name="allergies" placeholder="Tell us about any allergies, sensitivities, or medical notes."></textarea>
        </div>

        <div class="field">
          <label for="preferences">Preferences or other notes</label>
          <textarea id="preferences" name="preferences" placeholder="Example: prefer a quiet space, near public transit, no smoking, want a place with a couch."></textarea>
        </div>

        <div class="group">
          <label>Can you sleep on a couch if needed?</label>
          <div class="inline-row">
            <label class="radio-item"><input type="radio" name="sleepOnCouch" value="yes" /> Yes</label>
            <label class="radio-item"><input type="radio" name="sleepOnCouch" value="no" checked /> No</label>
          </div>
        </div>

        <div class="field">
          <label for="notes">Additional notes</label>
          <textarea id="notes" name="notes" placeholder="Anything else we should know?"></textarea>
        </div>

        <button type="submit">Save shelter request</button>
        <div id="message" class="message" role="alert" aria-live="polite"></div>
      </form>

      <a class="secondary-link" href="index.html">Back home</a>
    </main>

    <script src="User.js"></script>
    <script>
      const findShelterForm = document.getElementById("findShelterForm");
      const messageEl = document.getElementById("message");

      function setMessage(text, isError = false) {
        messageEl.textContent = text;
        messageEl.classList.toggle("error", isError);
      }

      function getLoggedInUserEmail() {
        const authToken = localStorage.getItem("authToken");
        if (!authToken) {
          window.location.href = "login.html";
          return null;
        }

        const loggedInUser = JSON.parse(localStorage.getItem("loggedInUser") || "{}");
        return loggedInUser.email || authToken || null;
      }

      async function readAccounts() {
        try {
          const response = await fetch("accounts.json", { cache: "no-store" });
          if (!response.ok) throw new Error("Missing accounts file");
          const text = await response.text();
          return text.trim() ? JSON.parse(text) : [];
        } catch (error) {
          const fallback = JSON.parse(localStorage.getItem("accountsFallback") || "[]");
          return Array.isArray(fallback) ? fallback : [];
        }
      }

      async function saveAccounts(users) {
        const payload = JSON.stringify(users, null, 2);

        try {
          await fetch("accounts.json", {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: payload
          });
        } catch (error) {
          localStorage.setItem("accountsFallback", JSON.stringify(users));
        }
      }

      function prefillCurrentUser() {
        const loggedInUser = JSON.parse(localStorage.getItem("loggedInUser") || "{}");
        if (!loggedInUser) return;

        if (loggedInUser.name) document.getElementById("name").value = loggedInUser.name;
        if (loggedInUser.email) document.getElementById("email").value = loggedInUser.email;
      }

      prefillCurrentUser();

      findShelterForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        const email = getLoggedInUserEmail();
        if (!email) {
          setMessage("You must be logged in to request shelter.", true);
          return;
        }

        const name = document.getElementById("name").value.trim();
        const emailValue = document.getElementById("email").value.trim().toLowerCase();
        const peopleCount = Number(document.getElementById("peopleCount").value);

        if (!name || !emailValue || !peopleCount || peopleCount < 1) {
          setMessage("Please enter your name, email, and household size.", true);
          return;
        }

        const accounts = await readAccounts();
        const accountIndex = accounts.findIndex((record) => (record.email || "").toLowerCase() === email.toLowerCase());

        if (accountIndex === -1) {
          setMessage("Your account could not be found. Please log in again.", true);
          return;
        }

        const user = User.fromObject(accounts[accountIndex]);
        user.setShelterRequest({
          name,
          email: emailValue,
          phone: document.getElementById("phone").value.trim(),
          peopleCount,
          hasPets: document.querySelector('input[name="hasPets"]:checked').value === "yes",
          openToAnimals: document.querySelector('input[name="animalInShelter"]:checked').value === "yes",
          allergies: document.getElementById("allergies").value.trim(),
          preferences: document.getElementById("preferences").value.trim(),
          canSleepOnCouch: document.querySelector('input[name="sleepOnCouch"]:checked').value === "yes",
          notes: document.getElementById("notes").value.trim()
        });

        accounts[accountIndex] = user;
        await saveAccounts(accounts);

        window.location.href = "shelters-nearby.html";
      });
    </script>
  </body>
</html>
